[workspace]
resolver = "2"
members = [
    "crates/aa4c-types",
    "crates/aa4c-proto",
    "crates/aa4c-identity",
    "crates/aa4c-discovery",
    "crates/aa4c-transfer",
    "crates/aa4c-store",
    "crates/aa4c-core",
    "crates/aa4c-server",
    "crates/aa4c-download",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/HuoTaoCN/AA4C"
rust-version = "1.85"

[workspace.dependencies]
# 内部 crates
aa4c-types = { path = "crates/aa4c-types" }
aa4c-proto = { path = "crates/aa4c-proto" }
aa4c-identity = { path = "crates/aa4c-identity" }
aa4c-discovery = { path = "crates/aa4c-discovery" }
aa4c-transfer = { path = "crates/aa4c-transfer" }
aa4c-store = { path = "crates/aa4c-store" }
aa4c-core = { path = "crates/aa4c-core" }
aa4c-server = { path = "crates/aa4c-server" }
aa4c-download = { path = "crates/aa4c-download" }

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# 网络与安全
mdns-sd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# 广域网会话层（CONNECT_DESIGN.md §5，里程碑 C1）：rustls-ring 特性解析到与上面同一套
# rustls/ring 版本树（已核实，无重复 crypto provider），零额外证书栈
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
x509-parser = "0.16"
blake3 = "1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
# 分享链接编码（CONNECT_DESIGN.md §7.2，里程碑 C6）：token 与链接 payload 都编成 base58
# （不含易混淆字符 0/O/I/l，人工传播/粘贴更不容易出错）
bs58 = "0.5"

# 存储
rusqlite = { version = "0.32", features = ["bundled"] }

# 下载引擎 RPC（V0.4 里程碑 D1，DOWNLOAD_DESIGN.md §3.2）：JSON-RPC over WebSocket
# 单连接，只连回环 aria2c，不需要 TLS 后端（default-features 关闭 native-tls）
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# 文件系统监听（同步索引实时更新，SYNC_DESIGN §3.2；带去抖，定时扫描仍作兜底）
notify-debouncer-mini = "0.4"

# 基础设施
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
hostname = "0.4"
uuid = { version = "1", features = ["v4"] }

# 测试
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
