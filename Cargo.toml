[workspace]
resolver = "2"
members = [
    "crates/aa4c-types",
    "crates/aa4c-proto",
    "crates/aa4c-identity",
    "crates/aa4c-discovery",
    "crates/aa4c-transfer",
    "crates/aa4c-store",
    "crates/aa4c-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/HuoTaoCN/AA4C"
rust-version = "1.77"

[workspace.dependencies]
# 内部 crates
aa4c-types = { path = "crates/aa4c-types" }
aa4c-proto = { path = "crates/aa4c-proto" }
aa4c-identity = { path = "crates/aa4c-identity" }
aa4c-discovery = { path = "crates/aa4c-discovery" }
aa4c-transfer = { path = "crates/aa4c-transfer" }
aa4c-store = { path = "crates/aa4c-store" }
aa4c-core = { path = "crates/aa4c-core" }

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# 网络与安全
mdns-sd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
x509-parser = "0.16"
blake3 = "1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# 存储
rusqlite = { version = "0.32", features = ["bundled"] }

# 文件系统监听（同步索引实时更新，SYNC_DESIGN §3.2；带去抖，定时扫描仍作兜底）
notify-debouncer-mini = "0.4"

# 基础设施
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
hostname = "0.4"
uuid = { version = "1", features = ["v4"] }

# 测试
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
