[package]
name = "aa4c-ai"
description = "AA4C 本地 AI 引擎：llama-server sidecar 进程 + 手写 OpenAI 兼容 HTTP 客户端 + 懒启动/空闲自停服务（V0.5 里程碑 AI2，ARCHIVE_DESIGN.md §3）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aa4c-types = { workspace = true }
aa4c-engine = { workspace = true }
# 知识库（里程碑 AI4，ARCHIVE_DESIGN.md §1）：知识库强依赖嵌入引擎，设计上整体
# 归属 aa4c-ai::kb（不是 aa4c-core），含它自己的扫描/CRUD，故这里直接依赖
# aa4c-store——aa4c-store 只依赖 aa4c-types，不会形成环。
aa4c-store = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
bs58 = { workspace = true }
uuid = { workspace = true }
# 知识库文档内容哈希（增量摄入判断），复用 aa4c-transfer 既有的文件哈希算法选型。
blake3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
