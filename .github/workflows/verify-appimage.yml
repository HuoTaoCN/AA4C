name: Verify AppImage bundling (temporary, NO_STRIP diagnosis)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Stage engine binaries (real download + verify)
        run: bash scripts/fetch-engines.sh x86_64-unknown-linux-gnu
      # 目标是复现 tauri-apps/tauri#14796/#15106 里 maintainer 确认的根因：
      # linuxdeploy 内部对打包进去的库跑 strip，遇到较新工具链产出的
      # `.relr.dyn` ELF 段会失败（"unknown type [0x13] section .relr.dyn"），
      # Tauri 只把这一步的失败包成语焉不详的 "failed to run linuxdeploy"，不
      # 透出真正的 stderr。NO_STRIP=true 让 linuxdeploy 跳过这一步。
      - name: Build AppImage with NO_STRIP=true
        working-directory: apps/desktop
        env:
          NO_STRIP: "true"
        run: pnpm tauri build --bundles appimage --verbose
      - name: List produced AppImage
        run: find src-tauri/target/release/bundle/appimage -maxdepth 2
        working-directory: apps/desktop
      - name: Smoke test the AppImage actually runs
        working-directory: apps/desktop
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)"
          if [[ -z "$appimage" ]]; then
            echo "error: no .AppImage produced" >&2
            exit 1
          fi
          chmod +x "$appimage"
          ls -la "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version || echo "exit=$?"
