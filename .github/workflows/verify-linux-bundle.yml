name: Verify Linux bundle (temporary, D2.7/D2.8 packaging check)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # 正式下载模式：真下载 + 真校验 aria2c + transmission-daemon（含依赖库），
      # 跟 release.yml 实际发布时走的是同一条路径，不是 --from-path 占位。
      - name: Stage engine binaries (real download + verify)
        run: bash scripts/fetch-engines.sh x86_64-unknown-linux-gnu
      - name: List staged binaries
        run: find apps/desktop/src-tauri/binaries -maxdepth 2
      - name: Build .deb bundle
        working-directory: apps/desktop
        run: pnpm tauri build --bundles deb
      # 工作区共享一个仓库根 target/（cargo workspace，不是每个 crate 各自的
      # target/），tauri build 实际产物落在 <repo-root>/target/release/bundle/，
      # 不是 apps/desktop/src-tauri/target/ 下——第一次跑漏了这个，find 扑空。
      - name: Locate the built .deb
        id: deb
        run: |
          deb="$(find target/release/bundle/deb -name '*.deb' | head -n1)"
          if [[ -z "$deb" ]]; then
            echo "error: no .deb produced" >&2
            find target/release/bundle -maxdepth 3 2>&1 || echo "(bundle dir doesn't exist either)"
            exit 1
          fi
          echo "path=$deb" >> "$GITHUB_OUTPUT"
      - name: Extract .deb and inspect layout
        run: |
          mkdir -p /tmp/debroot
          dpkg-deb -x "${{ steps.deb.outputs.path }}" /tmp/debroot
          echo "--- full tree ---"
          find /tmp/debroot -maxdepth 6
      # 这是本次要验证的核心问题：externalBin（transmission-daemon，进
      # usr/bin/）和 bundle.resources（依赖库，进 usr/lib/<Product>/）打包后
      # 落在不同目录，DOWNLOAD_DESIGN.md §3.6.6 记的修法是运行时注入
      # LD_LIBRARY_PATH——这里手动复现 TauriSidecarSpawner 在 spawn 前做的
      # 同一件事（用真实解出来的路径，不是猜的），验证 transmission-daemon
      # 在“依赖库和可执行文件不同目录”的真实打包产物里，靠 LD_LIBRARY_PATH
      # 确实能找到 libevent/libpsl/libminiupnpc，而不是巧合碰到系统里本来就
      # 装了同名库。
      - name: Smoke test transmission-daemon with injected LD_LIBRARY_PATH
        run: |
          bin="$(find /tmp/debroot -type f -name transmission-daemon | head -n1)"
          libdir="$(find /tmp/debroot -type d -name transmission-libs | head -n1)"
          echo "bin=$bin"
          echo "libdir=$libdir"
          if [[ -z "$bin" || -z "$libdir" ]]; then
            echo "error: could not locate transmission-daemon or its libs dir inside the bundle" >&2
            exit 1
          fi
          echo "--- ldd without LD_LIBRARY_PATH (expect missing libs) ---"
          ldd "$bin" || true
          echo "--- ldd WITH LD_LIBRARY_PATH (expect all resolved) ---"
          LD_LIBRARY_PATH="$libdir" ldd "$bin"
          echo "--- actually running --version with LD_LIBRARY_PATH ---"
          LD_LIBRARY_PATH="$libdir" "$bin" --version
      - name: Negative control — confirm it fails WITHOUT the env var (proves the test is meaningful)
        run: |
          bin="$(find /tmp/debroot -type f -name transmission-daemon | head -n1)"
          if env -i "$bin" --version; then
            echo "error: transmission-daemon ran WITHOUT LD_LIBRARY_PATH — the split-directory problem this workflow verifies may not actually apply here, results below are suspect" >&2
            exit 1
          else
            echo "confirmed: fails without LD_LIBRARY_PATH as expected (dependent libs not on default search path)"
          fi
