name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            # engines.yml 已跑通验证（SHA256SUMS 已填进 scripts/fetch-engines.sh），
            # 恢复 universal 双架构构建；v0.4.0-preview/v0.4.0-preview.1 曾因
            # engines.yml 还没验证过，临时改成只出 arm64。
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 \
            libevent-dev libpsl-dev libminiupnpc-dev libcurl4-openssl-dev libssl3 libgomp1
      # v0.4.0-preview.2 首次真实 tag push 里 appimage 目标报
      # "failed to run linuxdeploy"，Tauri 不透出底层 stderr，一开始按 FUSE
      # 缺失猜（装 libfuse2、设 APPIMAGE_EXTRACT_AND_RUN=1）都没用，最后靠
      # `pnpm tauri build --verbose` 才看到真正原因：linuxdeploy 打包阶段会
      # 扫描 usr/bin/ 下每个可执行文件的 ELF 依赖，在**系统路径**上找
      # transmission-daemon 需要的 libevent/libminiupnpc/libpsl/libcurl——这几
      # 个库平时只经 `bundle.resources` 打进最终产物、给运行时 `LD_LIBRARY_PATH`
      # 注入用（见 download_spawner.rs），跟 linuxdeploy 自己在打包阶段做的这次
      # 依赖扫描是两件事，系统上没装对应的库就直接报
      # "ERROR: Could not find dependency: libevent-2.1.so.7" 后中断整个打包。
      # libfuse2（真正需要，只是不是这次的根因）+ 这四个运行时库都装上后
      # appimage 打包成功（真机验证过，见 verify-appimage.yml 诊断记录）。
      #
      # `libssl3`/`libgomp1` 是 AI2（llama-server）同一类问题的预防性修——
      # ARCHIVE_DESIGN.md §3.1 第 2 点已经记录了这个新发现：llama-server 的
      # NEEDED 里有 `libssl.so.3`/`libcrypto.so.3`/`libgomp.so.1`，官方产物不带、
      # engines.yml 的 llama-linux job 选择自己打包一份塞进 -libs/（供**运行时**
      # `LD_LIBRARY_PATH` 用），但同上面的教训，linuxdeploy **打包阶段**的 ELF
      # 扫描走的是系统路径，不认 bundle.resources——这两个包在 ubuntu-latest
      # 镜像上大概率已经因为其他依赖被间接装上，这里显式声明只是不想赌"大概率"，
      # 具体这次 tag push 里 AppImage 打包是否真的过，仍需真实 CI 验证确认
      # （不能靠本地推理替代，同 §3.4 的既有要求）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # 下载引擎 sidecar 二进制（V0.4 里程碑 D1）：按 scripts/fetch-engines.sh 写死的
      # SHA256 校验和从 engines/aria2-<version> release 下载自建/官方转发产物——不
      # 再需要系统包管理器（brew/apt/choco）装 aria2，也不需要 aria2 出现在 PATH 上，
      # release 构建只是把校验过的二进制复制进 bundle，不执行它。macOS universal
      # 需要两个架构的产物都下载好，再自己 lipo 合并成最终的 universal sidecar——
      # 首次真实 tag push 里跑 universal 目标才发现：Tauri **不会**替 externalBin
      # 自动 lipo 合并两个单架构文件，`external_binaries()`（tauri-utils）只是
      # 简单地找 `<name>-universal-apple-darwin` 这个固定文件名，找不到就直接报
      # "resource path ... doesn't exist" 报错——这份 lipo 合并工作必须我们自己做
      # （见 scripts/fetch-engines.sh 顶部用法说明；那份注释此前的假设是错的）。
      - name: Stage aria2c + llama-server sidecars (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/fetch-engines.sh x86_64-unknown-linux-gnu
      - name: Stage aria2c + transmission-daemon + llama-server sidecars (macOS, both archs, lipo into universal)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-engines.sh aarch64-apple-darwin
          bash scripts/fetch-engines.sh x86_64-apple-darwin

          BIN_DIR=apps/desktop/src-tauri/binaries
          lipo -create -output "$BIN_DIR/aria2c-universal-apple-darwin" \
            "$BIN_DIR/aria2c-aarch64-apple-darwin" "$BIN_DIR/aria2c-x86_64-apple-darwin"
          lipo -create -output "$BIN_DIR/transmission-daemon-universal-apple-darwin" \
            "$BIN_DIR/transmission-daemon-aarch64-apple-darwin" "$BIN_DIR/transmission-daemon-x86_64-apple-darwin"
          lipo -create -output "$BIN_DIR/llama-server-universal-apple-darwin" \
            "$BIN_DIR/llama-server-aarch64-apple-darwin" "$BIN_DIR/llama-server-x86_64-apple-darwin"
          chmod +x "$BIN_DIR/aria2c-universal-apple-darwin" "$BIN_DIR/transmission-daemon-universal-apple-darwin" \
            "$BIN_DIR/llama-server-universal-apple-darwin"

          # 依赖库同理需要 lipo 成 fat dylib——两个单架构 -libs/ 目录里文件名完全
          # 相同，如果不合并、直接让 bundle.resources 的 glob 两个目录都扫到，会
          # 把其中一个架构的 dylib 覆盖另一个（谁在文件系统遍历顺序里靠后谁赢），
          # universal 二进制里"输"的那个架构切片运行时会加载到架构不匹配的
          # dylib，dyld 会拒绝加载并崩溃。lipo 合并成一份 fat dylib 后删掉两个
          # 单架构目录，让 glob 只会唯一匹配到合并后的这一份。
          mkdir -p "$BIN_DIR/transmission-daemon-universal-apple-darwin-libs"
          for f in "$BIN_DIR"/transmission-daemon-aarch64-apple-darwin-libs/*; do
            name="$(basename "$f")"
            lipo -create -output "$BIN_DIR/transmission-daemon-universal-apple-darwin-libs/$name" \
              "$BIN_DIR/transmission-daemon-aarch64-apple-darwin-libs/$name" \
              "$BIN_DIR/transmission-daemon-x86_64-apple-darwin-libs/$name"
          done
          rm -rf "$BIN_DIR/transmission-daemon-aarch64-apple-darwin-libs" \
            "$BIN_DIR/transmission-daemon-x86_64-apple-darwin-libs"

          # llama-server 的两个单架构 -libs/ 目录**不完全对称**（ARCHIVE_DESIGN.md
          # §3.1 第 2 点：x64 官方产物没有 libggml-metal，那是 Apple Silicon 专属
          # 的 GPU 后端）——文件名集合取并集，两边都有的才 lipo 合并，只有一边有
          # 的（目前只有 libggml-metal 这一个）直接原样拷贝，不需要（也没法）
          # 合并一个不存在的架构切片。
          #
          # **真机 CI 踩到的坑（v0.5.0-preview 首次真实发布）**：这个目录里不是
          # 只有 dylib——llama.cpp release 包里还带了一份 `LICENSE` 纯文本文件，
          # 两个架构下内容相同但都不是 Mach-O，直接对着它 `lipo -create` 会报
          # "can't figure out the architecture type" 中断整个 job。用 `lipo -info`
          # 探测"两边都有的文件是不是真的 Mach-O"，不是 Mach-O 的（文本文件等）
          # 直接当"内容天然一致"处理，只拷贝一份，不试图合并。
          mkdir -p "$BIN_DIR/llama-server-universal-apple-darwin-libs"
          (cd "$BIN_DIR/llama-server-aarch64-apple-darwin-libs" && find . -type f -o -type l) | sed 's|^\./||' > /tmp/arm64_libs.txt
          (cd "$BIN_DIR/llama-server-x86_64-apple-darwin-libs" && find . -type f -o -type l) | sed 's|^\./||' > /tmp/x64_libs.txt
          sort -u /tmp/arm64_libs.txt /tmp/x64_libs.txt | while IFS= read -r name; do
            arm64_f="$BIN_DIR/llama-server-aarch64-apple-darwin-libs/$name"
            x64_f="$BIN_DIR/llama-server-x86_64-apple-darwin-libs/$name"
            out="$BIN_DIR/llama-server-universal-apple-darwin-libs/$name"
            if [[ -f "$arm64_f" && -f "$x64_f" ]] && lipo -info "$arm64_f" >/dev/null 2>&1; then
              lipo -create -output "$out" "$arm64_f" "$x64_f"
            elif [[ -f "$arm64_f" ]]; then
              cp -P "$arm64_f" "$out"
            else
              cp -P "$x64_f" "$out"
            fi
          done
          rm -rf "$BIN_DIR/llama-server-aarch64-apple-darwin-libs" \
            "$BIN_DIR/llama-server-x86_64-apple-darwin-libs"
      - name: Stage aria2c + llama-server sidecars (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash scripts/fetch-engines.sh x86_64-pc-windows-msvc
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 这两个都是 AppImage 打包排障过程中留下的、经真机验证过能一起跑通的
          # 组合——没有逐个拆开确认是否每个都严格必需（真正根因见上面 apt 那步
          # 的注释：linuxdeploy 系统路径依赖扫描缺库，不是这两个变量本身要解决
          # 的问题），但两个都不影响正常构建，留着比之后再猜一遍划算。
          # APPIMAGE_EXTRACT_AND_RUN：linuxdeploy 自己也是个 AppImage，容器化
          # runner 不一定真的暴露 /dev/fuse 给非特权进程挂载，这个变量让它落到
          # "解包后直接跑"，不走 FUSE。NO_STRIP：linuxdeploy 内部会对打包的库跑
          # strip，较新工具链（常见于 rolling-release 发行版）产出的 `.relr.dyn`
          # ELF 段会让 strip 失败（上游 tauri-apps/tauri#14796/#15106），跳过它。
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "AA4C ${{ github.ref_name }}"
          # TODO(Linux AppImage CI 环境问题查清楚后恢复 ".AppImage" 措辞)：这次
          # 发布 Linux 只出 .deb/.rpm，见上方 ubuntu-latest args 的注释。
          releaseBody: |
            桌面安装包（.dmg / .msi / .deb / .rpm）与 Android APK（arm64，实验版）见下方 Assets。安装与防火墙说明见 README。

            ${{ contains(github.ref_name, '-') && '⚠️ 预览版，详细变更见 CHANGELOG.md。' || '' }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  android:
    name: Android APK
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build debug APK (arm64)
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: pnpm tauri android build --apk --debug --target aarch64
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "dist-apk/AA4C_${{ github.ref_name }}_android-arm64.apk"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-apk/*.apk

  server:
    name: aa4c-server (Linux binary)
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p aa4c-server
      - name: Stage binary
        run: |
          mkdir -p dist-server
          cp target/release/aa4c-server "dist-server/aa4c-server_${{ github.ref_name }}_linux-x86_64"
      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-server/*
