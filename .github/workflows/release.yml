name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # AppImage 目标在 GitHub Actions ubuntu-latest（24.04）上一直报
            # "failed to run linuxdeploy"（Tauri 侧不透出任何底层 stderr），装
            # libfuse2、设 APPIMAGE_EXTRACT_AND_RUN=1 两个标准方案都试过仍然
            # 失败——deb/rpm 每次都能正常打包，问题只在 appimage 这一个 bundle
            # 目标。用户决定：这次先只出 deb+rpm，AppImage 的 CI 环境问题留到
            # 以后单独查，不阻塞这次发布（TODO：查清楚后把 appimage 加回来）。
            args: "--bundles deb,rpm"
          - os: macos-latest
            # engines.yml 已跑通验证（SHA256SUMS 已填进 scripts/fetch-engines.sh），
            # 恢复 universal 双架构构建；v0.4.0-preview/v0.4.0-preview.1 曾因
            # engines.yml 还没验证过，临时改成只出 arm64。
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      # v0.4.0-preview.2 首次真实 tag push 里第一次撞见：AppImage 打包用的
      # linuxdeploy 是个 AppImage 本身，运行它需要 FUSE——`ubuntu-latest`（现在
      # 是 24.04/noble）默认只带 FUSE3，libfuse2 兼容层不再预装（`v0.4.0-preview.1`
      # 那次发布用的还是旧镜像，没踩到这个），不装的话 `failed to run linuxdeploy`
      # 报错发生在 deb/rpm 都已经成功打包之后，只有 appimage 这一个 bundle 目标炸。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # 下载引擎 sidecar 二进制（V0.4 里程碑 D1）：按 scripts/fetch-engines.sh 写死的
      # SHA256 校验和从 engines/aria2-<version> release 下载自建/官方转发产物——不
      # 再需要系统包管理器（brew/apt/choco）装 aria2，也不需要 aria2 出现在 PATH 上，
      # release 构建只是把校验过的二进制复制进 bundle，不执行它。macOS universal
      # 需要两个架构的产物都下载好，再自己 lipo 合并成最终的 universal sidecar——
      # 首次真实 tag push 里跑 universal 目标才发现：Tauri **不会**替 externalBin
      # 自动 lipo 合并两个单架构文件，`external_binaries()`（tauri-utils）只是
      # 简单地找 `<name>-universal-apple-darwin` 这个固定文件名，找不到就直接报
      # "resource path ... doesn't exist" 报错——这份 lipo 合并工作必须我们自己做
      # （见 scripts/fetch-engines.sh 顶部用法说明；那份注释此前的假设是错的）。
      - name: Stage aria2c sidecar (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/fetch-engines.sh x86_64-unknown-linux-gnu
      - name: Stage aria2c + transmission-daemon sidecars (macOS, both archs, lipo into universal)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-engines.sh aarch64-apple-darwin
          bash scripts/fetch-engines.sh x86_64-apple-darwin

          BIN_DIR=apps/desktop/src-tauri/binaries
          lipo -create -output "$BIN_DIR/aria2c-universal-apple-darwin" \
            "$BIN_DIR/aria2c-aarch64-apple-darwin" "$BIN_DIR/aria2c-x86_64-apple-darwin"
          lipo -create -output "$BIN_DIR/transmission-daemon-universal-apple-darwin" \
            "$BIN_DIR/transmission-daemon-aarch64-apple-darwin" "$BIN_DIR/transmission-daemon-x86_64-apple-darwin"
          chmod +x "$BIN_DIR/aria2c-universal-apple-darwin" "$BIN_DIR/transmission-daemon-universal-apple-darwin"

          # 依赖库同理需要 lipo 成 fat dylib——两个单架构 -libs/ 目录里文件名完全
          # 相同，如果不合并、直接让 bundle.resources 的 glob 两个目录都扫到，会
          # 把其中一个架构的 dylib 覆盖另一个（谁在文件系统遍历顺序里靠后谁赢），
          # universal 二进制里"输"的那个架构切片运行时会加载到架构不匹配的
          # dylib，dyld 会拒绝加载并崩溃。lipo 合并成一份 fat dylib 后删掉两个
          # 单架构目录，让 glob 只会唯一匹配到合并后的这一份。
          mkdir -p "$BIN_DIR/transmission-daemon-universal-apple-darwin-libs"
          for f in "$BIN_DIR"/transmission-daemon-aarch64-apple-darwin-libs/*; do
            name="$(basename "$f")"
            lipo -create -output "$BIN_DIR/transmission-daemon-universal-apple-darwin-libs/$name" \
              "$BIN_DIR/transmission-daemon-aarch64-apple-darwin-libs/$name" \
              "$BIN_DIR/transmission-daemon-x86_64-apple-darwin-libs/$name"
          done
          rm -rf "$BIN_DIR/transmission-daemon-aarch64-apple-darwin-libs" \
            "$BIN_DIR/transmission-daemon-x86_64-apple-darwin-libs"
      - name: Stage aria2c sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash scripts/fetch-engines.sh x86_64-pc-windows-msvc
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy（AppImage 打包工具）自己也是个 AppImage，装了 libfuse2 之后
          # 还是报同样的 "failed to run linuxdeploy"——GitHub Actions 的容器化
          # runner 即使装了库，也不一定真的暴露 /dev/fuse 给非特权进程挂载。标准
          # 绕过方式：让它落到"解包后直接跑"这条路径，不走 FUSE 挂载。
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "AA4C ${{ github.ref_name }}"
          # TODO(Linux AppImage CI 环境问题查清楚后恢复 ".AppImage" 措辞)：这次
          # 发布 Linux 只出 .deb/.rpm，见上方 ubuntu-latest args 的注释。
          releaseBody: |
            桌面安装包（.dmg / .msi / .deb / .rpm）与 Android APK（arm64，实验版）见下方 Assets。安装与防火墙说明见 README。

            ${{ contains(github.ref_name, '-') && '⚠️ 预览版，详细变更见 CHANGELOG.md。' || '' }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  android:
    name: Android APK
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build debug APK (arm64)
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: pnpm tauri android build --apk --debug --target aarch64
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "dist-apk/AA4C_${{ github.ref_name }}_android-arm64.apk"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-apk/*.apk

  server:
    name: aa4c-server (Linux binary)
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p aa4c-server
      - name: Stage binary
        run: |
          mkdir -p dist-server
          cp target/release/aa4c-server "dist-server/aa4c-server_${{ github.ref_name }}_linux-x86_64"
      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-server/*
