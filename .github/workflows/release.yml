name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            # engines.yml 已跑通验证（SHA256SUMS 已填进 scripts/fetch-engines.sh），
            # 恢复 universal 双架构构建；v0.4.0-preview/v0.4.0-preview.1 曾因
            # engines.yml 还没验证过，临时改成只出 arm64。
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # 下载引擎 sidecar 二进制（V0.4 里程碑 D1）：按 scripts/fetch-engines.sh 写死的
      # SHA256 校验和从 engines/aria2-<version> release 下载自建/官方转发产物——不
      # 再需要系统包管理器（brew/apt/choco）装 aria2，也不需要 aria2 出现在 PATH 上，
      # release 构建只是把校验过的二进制复制进 bundle，不执行它。macOS universal
      # 需要两个架构的产物都下载好，供 Tauri 自己 lipo 合并进最终的 universal sidecar
      # （见 scripts/fetch-engines.sh 顶部用法说明）。
      - name: Stage aria2c sidecar (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/fetch-engines.sh x86_64-unknown-linux-gnu
      - name: Stage aria2c sidecar (macOS, both archs for universal)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          bash scripts/fetch-engines.sh aarch64-apple-darwin
          bash scripts/fetch-engines.sh x86_64-apple-darwin
      - name: Stage aria2c sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash scripts/fetch-engines.sh x86_64-pc-windows-msvc
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "AA4C ${{ github.ref_name }}"
          releaseBody: |
            桌面安装包（.dmg / .msi / .AppImage）与 Android APK（arm64，实验版）见下方 Assets。安装与防火墙说明见 README。

            ${{ contains(github.ref_name, '-') && '⚠️ 预览版，详细变更见 CHANGELOG.md。' || '' }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  android:
    name: Android APK
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build debug APK (arm64)
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: pnpm tauri android build --apk --debug --target aarch64
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "dist-apk/AA4C_${{ github.ref_name }}_android-arm64.apk"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-apk/*.apk

  server:
    name: aa4c-server (Linux binary)
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p aa4c-server
      - name: Stage binary
        run: |
          mkdir -p dist-server
          cp target/release/aa4c-server "dist-server/aa4c-server_${{ github.ref_name }}_linux-x86_64"
      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-server/*
