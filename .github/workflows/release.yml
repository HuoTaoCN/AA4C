name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            # TODO(engines.yml 验证后恢复)：本该是 universal-apple-darwin（Apple Silicon +
            # Intel 双架构），但 .github/workflows/engines.yml 从未真正跑过、校验和是空的，
            # 这次 v0.4.0-preview 临时改成只出 arm64——GitHub Actions 的 macos-latest
            # runner 本身是 arm64，用 --from-path 兜底只能拿到本机架构的系统 aria2c，
            # 没有 x86_64 版本可用（brew 在 arm64 runner 上不装 x86_64 包）。engines.yml
            # 跑通、拿到两个架构的自建产物并把校验和填进 scripts/fetch-engines.sh 后，
            # 这里要改回 universal-apple-darwin。Intel Mac 用户这个 preview 版本用不了。
            args: "--target aarch64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # 下载引擎 sidecar 二进制（V0.4 里程碑 D1）。
      # TODO(engines.yml 验证后恢复)：本该是 `bash scripts/fetch-engines.sh <triple>`
      # 按写死校验和下载自建/官方产物，但 engines.yml 从未真正跑过、校验和是空的——
      # 这次 v0.4.0-preview 临时改用 --from-path（装系统包管理器版本的 aria2c 顶位，
      # 不校验，见 CHANGELOG.md 0.4.0-preview 条目的说明）。engines.yml 跑通并把
      # SHA256SUMS 填进 scripts/fetch-engines.sh 后，这三步都要改回真正的校验和下载。
      - name: Install aria2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Install aria2 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install aria2
      - name: Install aria2 (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install aria2 -y
      - name: Stage aria2c sidecar (dev/preview only, not checksum-verified)
        shell: bash
        run: bash scripts/fetch-engines.sh --from-path
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "AA4C ${{ github.ref_name }}"
          releaseBody: |
            桌面安装包（.dmg / .msi / .AppImage）与 Android APK（arm64，实验版）见下方 Assets。安装与防火墙说明见 README。

            ${{ contains(github.ref_name, '-') && '⚠️ 预览版，详细变更见 CHANGELOG.md。' || '' }}
            ${{ github.ref_name == 'v0.4.0-preview' && '⚠️ macOS 这次只出 Apple Silicon（arm64）安装包，不含 Intel——下载中心引擎二进制的自建构建流水线还未验证通过，见 CHANGELOG.md 0.4.0-preview 条目说明。协议完全兼容，无需强制同步升级。' || '' }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  android:
    name: Android APK
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build debug APK (arm64)
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: pnpm tauri android build --apk --debug --target aarch64
      - name: Stage APK
        run: |
          mkdir -p dist-apk
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "dist-apk/AA4C_${{ github.ref_name }}_android-arm64.apk"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-apk/*.apk

  server:
    name: aa4c-server (Linux binary)
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p aa4c-server
      - name: Stage binary
        run: |
          mkdir -p dist-server
          cp target/release/aa4c-server "dist-server/aa4c-server_${{ github.ref_name }}_linux-x86_64"
      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-server/*
