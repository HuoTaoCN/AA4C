name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev aria2 \
            transmission-daemon
      # llama-server（V0.5 AI2）不在 apt 仓库——没有可装的系统包，同 engines.yml
      # 的 llama-linux job 一样直接下官方 release 解出来，放进 PATH。lint 不执行
      # 子进程，不需要额外设 LD_LIBRARY_PATH（那是 test job 才要操心的事）。
      - name: Install llama-server (Linux, official prebuilt, unpack only)
        run: |
          curl -fsSL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b10175/llama-b10175-bin-ubuntu-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/llama"
          tar xzf llama.tar.gz -C "$RUNNER_TEMP/llama"
          dirname "$(find "$RUNNER_TEMP/llama" -name llama-server -type f)" >> "$GITHUB_PATH"
      # aa4c-desktop 声明了 externalBin（下载中心/AI 引擎 sidecar，里程碑 D1
      # aria2c + D2 transmission-daemon + AI2 llama-server）：cargo 一碰这个
      # crate 就会校验这些文件存在，`--from-path` 只是把 CI 里装好的系统二进制
      # 复制过去顶个位置——lint/test 不需要真的执行子进程，不影响这一步验证的
      # 内容。
      - name: Stage sidecar placeholders
        run: bash scripts/fetch-engines.sh --from-path
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # aa4c-download 的集成测试驱动真实 aria2c（见 crates/aa4c-download/tests/），
      # aa4c-desktop 的 externalBin 声明也需要一份摆在 binaries/ 下才能编译（见上）。
      - name: Install aria2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y aria2
      - name: Install aria2 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install aria2
      # 不用 `choco install aria2`：choco 装的是一个 shim（真正的 aria2c.exe 在别处，
      # shim 靠相对路径找它），这个相对路径解析是相对于**调用进程的工作目录**、不是
      # shim 自己所在的目录——从 `cargo test`（工作目录是仓库根/crate 目录）调用会
      # 直接报"Cannot find file at '..\lib\aria2\tools\...'"，是真机 CI 上实测踩到
      # 的坑，不是猜的。改成直接下官方 Windows 压缩包解出真正的二进制，版本号要跟
      # scripts/fetch-engines.sh 的 ARIA2_VERSION 保持一致。
      - name: Install aria2 (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -fsSL -o aria2.zip "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
          unzip -j aria2.zip "*/aria2c.exe" -d "$RUNNER_TEMP/aria2"
          echo "$RUNNER_TEMP/aria2" >> "$GITHUB_PATH"
      # aa4c-download 的 D2 集成测试驱动真实 transmission-daemon（见
      # crates/aa4c-download/src/transmission_process.rs 的 #[cfg(test)]）。
      - name: Install transmission-daemon (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y transmission-daemon
      - name: Install transmission-daemon (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install transmission-cli
      # 没有 choco 包能给（社区包大多是 GUI），官方也不发布单独的 daemon 二进制——
      # 官方 Windows 安装包是 MSI，`msiexec /a <msi> /qn TARGETDIR=...` 是"管理员
      # 镜像解包"，不是安装（不注册服务、不写注册表、不进 PATH、不弹 UI），解出来的
      # 目录里含 transmission-daemon.exe（同目录还有它依赖的 DLL，一并留在原地，
      # 不能只挪二进制本身）。DOWNLOAD_DESIGN.md §3.6.5 定的正式打包方案就是这条路，
      # 这里先在 CI 里验证一遍这个提取方法本身是否可行。
      - name: Install transmission-daemon (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\transmission.msi"
          Invoke-WebRequest -Uri "https://github.com/transmission/transmission/releases/download/4.1.3/transmission-4.1.3-x64.msi" -OutFile $msi
          $extractDir = "$env:RUNNER_TEMP\transmission"
          Start-Process msiexec.exe -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$extractDir`"" -Wait -NoNewWindow
          $exe = Get-ChildItem -Path $extractDir -Filter "transmission-daemon.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "transmission-daemon.exe not found after MSI extraction" }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
      # aa4c-ai 的集成测试驱动真实 llama-server（V0.5 AI2，见
      # crates/aa4c-ai/src/{process,service}.rs 的 #[cfg(test)]）。macOS 用
      # `brew install llama.cpp`（同 ARCHIVE_DESIGN.md §3.4，rpath 由 Homebrew
      # 自己处理，不需要额外设 DYLD_LIBRARY_PATH）；Linux/Windows 没有系统包，
      # 直接下官方 release 解出来（同 engines.yml 的 llama-linux/windows job
      # 用的同一份官方产物，未裁剪版本自带全部依赖库，够测试用）。
      - name: Install llama-server (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install llama.cpp
      - name: Install llama-server (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -fsSL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b10175/llama-b10175-bin-ubuntu-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/llama"
          tar xzf llama.tar.gz -C "$RUNNER_TEMP/llama"
          bin_dir="$(dirname "$(find "$RUNNER_TEMP/llama" -name llama-server -type f)")"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "AA4C_TEST_LLAMA_SERVER_BIN=$bin_dir/llama-server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$bin_dir" >> "$GITHUB_ENV"
      - name: Install llama-server (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\llama.zip"
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b10175/llama-b10175-bin-win-cpu-x64.zip" -OutFile $zip
          $extractDir = "$env:RUNNER_TEMP\llama"
          Expand-Archive -Path $zip -DestinationPath $extractDir
          $exe = Get-ChildItem -Path $extractDir -Filter "llama-server.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe not found after extraction" }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value "AA4C_TEST_LLAMA_SERVER_BIN=$($exe.FullName)"
      # 微型 GGUF 测试固件（ARCHIVE_DESIGN.md §3.1 第 6 点：来源/SHA256 已实证），
      # 三平台共用同一份，走我们自己的 engines/test-fixtures release（不依赖第
      # 三方 URL 稳定性，engines.yml 惯例）。
      - name: Download tiny GGUF test fixture
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/stories260K.gguf"
          curl -fsSL -o "$dest" "https://github.com/HuoTaoCN/AA4C/releases/download/engines/test-fixtures/stories260K.gguf"
          # 剥掉可能的前导反斜杠：GNU coreutils 的 sha256sum 在文件名（这里是
          # $RUNNER_TEMP，Windows 上是反斜杠路径）含反斜杠时，会整行加一个
          # `\` 转义前缀标记——真机 Windows CI 实测确认，awk 按空白切分会把
          # 这个 `\` 也当成哈希的一部分，导致校验和比对总是失败。
          actual="$(sha256sum "$dest" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$dest" | awk '{print $1}')"
          actual="${actual#\\}"
          expected="270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d"
          if [[ "$actual" != "$expected" ]]; then
            echo "error: stories260K.gguf checksum mismatch (expected $expected, got $actual)" >&2
            exit 1
          fi
          echo "AA4C_TEST_TINY_GGUF=$dest" >> "$GITHUB_ENV"
      - name: Stage sidecar placeholders
        shell: bash
        run: bash scripts/fetch-engines.sh --from-path
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast：不加的话，任何一个测试二进制（哪怕是众所周知会偶发
      # flaky 的 quic_resume_after_disconnect 那种）一失败，cargo 直接整体
      # 中断，后面排在它之后的测试二进制（含这次新增的 aa4c-download D2
      # 测试）连跑都不跑——实测踩到过：PR #1 的 CI 因为 aa4c-core 里排在前面
      # 的已知 flaky 用例先炸了，aa4c-download 的新测试根本没机会验证。
      - run: cargo test --workspace --no-fail-fast

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      # 忽略的 RUSTSEC-2026-0194 / 0195 是 quick-xml 的 DoS 公告，来自 Tauri 打包链路的
      # 传递依赖（plist → macOS bundle 元数据、tauri-winrt-notification → Windows 通知），
      # 只解析我们自有的构建配置 / bundle XML，运行时不接触任何不可信输入，实际攻击面≈0；
      # 依赖方 pin 了 quick-xml ^0.37/^0.39 无法就地升到 >=0.41，待上游 Tauri/plist 升级后
      # 移除此忽略。其余 unmaintained/unsound 属 cargo-audit 默认告警、不阻断。
      - run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  # Android 编译哨兵（A0）：只验证能构建出 debug APK，不阻塞合并
  android:
    name: Android (build sentinel)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build debug APK
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: pnpm tauri android build --apk --target aarch64 --debug
